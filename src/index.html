<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Kennyan Escobedo" />
    <meta name="description" content="TripleTen Spots" />
    <meta name="keywords" content="TripleTen HTML sprint Kenny" />
    <link rel="shortcut icon" href="favicon.ico" />
    <title>Spots</title>
</head>
<body>
    <div class="page">
        <header class="header">
            <img id="logo" alt="Spots logo" class="header__logo">
        </header>
        <main class="content">
            <section class="profile page__section">
                <div class="profile__avatar-container">
                <button class="profile__avatar-btn">
                    <img id="lightPencil"  alt="light pencil" class="profile__pencil-icon">
                </button>
                <img  id="avatar" alt="Bessie Coleman" class="profile__avatar">
                </div>
                <div class="profile__column">
                    <h1 class="profile__name">Bessie Coleman</h1>
                    <p class="profile__description">Civil Aviator</p>
                    <button type="button" class="profile__edit-btn">
                        <img id="pencil"   class="profile__edit-btn-img" alt="Pencil icon">Edit Profile
                    </button>
                </div>
                <button type="button" class="profile__add-btn">
                    <img id="plus" class="profile__add-btn-image" alt="plus icon">New Post
                </button>
            </section>
            <section class="cards page__section">
                <ul class="cards__list">
                    <template id="card-template">
                        <li class="card">
                            <div class="card__image-container">
                            <img src="" alt="" class="card__image">
                            <button class="card__trash-btn"></button>
                        </div>
                            <div class="card__content">
                                <h2 class="card__title"></h2>
                                <button type="button" class="card__like-btn"></button>
                            </div>
                        </li>
                    </template>
                </ul>  
            </section>
        </main>
        <footer class="footer">
            <h3 class="footer__copyright">2025 &copy; Kennyan Escobedo</h3>
        </footer>
        <div class="modal" id="edit-modal">
            <div class="modal__container">
                <button type="button" class="modal__close-btn"></button>
                <h2 class="modal__title">Edit Profile</h2>
                <form name="edit-profile" class="modal__form">
                    <label for="profile-name-input" class="modal__label">
                        Name
                        <input id="profile-name-input" type="text" class="modal__input" placeholder="Type your name" required minlength="2" maxlength="40">
                        <span id="profile-name-input-error" class="modal__error"></span>
                    </label>
                    <label for="profile-description-input" class="modal__label">
                        Description
                        <input id="profile-description-input" type="text" class="modal__input" placeholder="Describe yourself" required minlength="2" maxlength="200"> 
                        <span id="profile-description-input-error" class="modal__error"></span>
                    </label>
                    <button type="submit" class="modal__submit-btn">Save</button>
                </form>
            </div>
        </div>
        <div class="modal" id="modal-card-modal">
            <div class="modal__container">
                <button type="button" class="modal__close-btn"></button>
                <h2 class="modal__title">New Post</h2>
                <form name="card-form" class="modal__form">
                    <label for="add-card-link-input" class="modal__label">
                        Image Link
                        <input name="link" id="add-card-link-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required minlength="2" maxlength="300">
                        <span id="add-card-link-input-error" class="modal__error"></span>
                    </label>
                    <label for="add-card-name-input" class="modal__label">
                        Caption
                        <input name="name" id="add-card-name-input" type="text" class="modal__input" placeholder="Type your caption" required minlength="2" maxlength="30">
                        <span id="add-card-name-input-error" class="modal__error"></span>
                    </label>
                    <button type="submit" class="modal__submit-btn">Save</button>
                </form>
            </div>
        </div>
    </div>
    <div class="modal" id="preview-modal">
        <div class="modal__content modal__content_type_preview">
            <button type="button" class="modal__close-btn modal__close-btn_type_preview"></button>
            <img class="modal__image" src="" alt="">
            <p class="modal__caption"></p>
        </div>
    </div>
        <div class="modal" id="avatar-modal">
            <div class="modal__container">
                <button type="button" class="modal__close-btn"></button>
                <h2 class="modal__title">Edit profile avatar</h2>
                <form name="edit-profile" class="modal__form" id="edit-avatar-form">
                    <label for="profile-avatar-input" class="modal__label">
                        Profile Picture
                        <input name="avatar" id="profile-avatar-input" type="text" class="modal__input" placeholder="Paste the link to an image">
                        <span id="profile-avatar-input-error" class="modal__error"></span>
                    </label>
                    <button type="submit" class="modal__submit-btn">Save</button>
                </form>
            </div>
        </div>
        <div class="modal" id="delete-modal">
            <div class="modal__container modal__delete-container">
                <button type="button" class="modal__close-btn modal__delete_close-btn"></button>
                <h2 class="modal__title">Are you sure you want to delete this image?</h2>
                <div class="modal__delete-actions">
                    <button type="submit" class="modal__delete-btn">Delete</button>
                    <button type="button" class="modal__cancel-btn">Cancel</button>
                </div>
            </div>
        </div>
</body>
</html>
